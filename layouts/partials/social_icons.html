<div class="social-icons" {{ with .align }}align="{{ . }}"{{ end }}>
    {{- range site.Params.socialIcons }}
    {{- if eq .name "wechat" }}
    <button class="wechat-contact" type="button" aria-label="WeChat" aria-describedby="wechat-id">
        {{ partial "svg.html" . }}
        <span class="wechat-tooltip" id="wechat-id" role="tooltip">WeChat: {{ .username }}</span>
    </button>
    {{- else }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
    </a>
    {{- end }}
    {{- end }}
</div>
