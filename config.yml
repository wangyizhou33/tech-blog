baseURL: "https://wangyizhou33.github.io/tech-blog/"
title: Yizhou's Tech Blog
copyright: "© Yizhou Wang"
theme: [hugo-PaperMod]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

minify:
  disableXML: true

pagination:
  disableAliases: false
  pagerSize: 5

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: About
          url: about/
          weight: 1
        - name: Archive
          url: archives
          weight: 5
        - name: Search
          url: search/
          weight: 10
        - name: Tags
          url: tags/
          weight: 15

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "Yizhou Wang's tech blog — robotics, software engineering, and notes from the field."
  author: Yizhou Wang

  defaultTheme: auto
  ShowShareButtons: false
  ShowReadingTime: true
  displayFullLangName: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true

  homeInfoParams:
    Title: "Hi, I'm Yizhou"
    Content: >
      Welcome to my tech blog. I write about robotics, software engineering, and whatever else I find interesting.

  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/wangyizhou33"

  assets:
    disableHLJS: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
